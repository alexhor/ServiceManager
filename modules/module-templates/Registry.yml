# DO NOT EDIT --- File generated by ServiceManager --- DO NOT EDIT
# Template modified from: https://github.com/zammad/zammad-docker-compose
---
x-shared:
  registry-service: &registry-service
    image: registry
    restart: always
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_PATH: /htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry Auth"
      OTEL_TRACES_EXPORTER: "none"
      REGISTRY_LOG_LEVEL: info
      REGISTRY_LOG_FIELDS_ENVIRONMENT: production
    volumes:
      - ./registry:/var/lib/registry
      - ./htpasswd:/htpasswd:ro

services:
  registry:
    <<: *registry-service
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${DOMAIN}`)'
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=LetsEncrypt

  registry-cleanup:
    <<: *registry-service
    init: true
    entrypoint: crond -f
    configs:
      - source: crontab
        target: /etc/crontabs/root

  builder:
    extends:
      file: builder/docker-compose.yml
      service: builder
    environment:
      REGISTRY_HOST: "${DOMAIN}"
      REGISTRY_USER: "${REGISTRY_BUILDER_USER}"
      REGISTRY_PASS: "${REGISTRY_BUILDER_PASS}"

networks:
  proxy:
    name: ${PROXY_NETWORK_NAME}
    external: true

configs:
  crontab:
    # Garbage-collect the stored images every monday at 05:30
    content: |
      30 05 * * MON /bin/registry garbage-collect --delete-untagged /etc/distribution/config.yml
